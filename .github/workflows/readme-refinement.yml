name: Refine README Accuracy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/readme-refinement.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply focused README corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")

          replacements = {
              "AI & ML Engineer · Data Scientist & Analyst · Software Engineering Student":
                  "Software Engineering Student · AI & Software Engineering",
              "- [HumanAware Scheduling Automation Engine](#-humanaware-scheduling-automation-engine)":
                  "- [H-ASAE Scheduling Engine](#-h-asae-scheduling-engine)",
              "- Google Sign-In support with setup-aware error handling":
                  "- Google and Apple Sign-In support with setup-aware configuration checks",
              "## 🧠 HumanAware Scheduling Automation Engine":
                  "## 🧠 H-ASAE Scheduling Engine",
              "The **HumanAware Scheduling Automation Engine** is the intelligence layer behind Smart Life Planner.":
                  "The **Human-Aware Adaptive Scheduling & Automation Engine (H-ASAE)** is the deterministic, explainable planning layer behind Smart Life Planner. Rather than relying on an opaque model, it combines rule-based eligibility, weighted task scoring, overload detection, prayer-aware time constraints, and user-confirmed schedule generation.",
              "| AI / Voice | AI-assisted parsing and voice capture flows |":
                  "| AI / Voice | Groq API, Whisper Large v3 Turbo, Llama task parsing, and deterministic H-ASAE scheduling |",
              "JWT_SECRET_KEY=change_me_to_a_secure_secret\nJWT_ALGORITHM=HS256\nACCESS_TOKEN_EXPIRE_MINUTES=1440":
                  "SECRET_KEY=change_me_to_a_secure_secret\nALGORITHM=HS256\nACCESS_TOKEN_EXPIRE_MINUTES=1440\nGROQ_API_KEY=your_groq_api_key",
              "GOOGLE_CLIENT_ID=your_google_web_client_id.apps.googleusercontent.com":
                  "GOOGLE_CLIENT_ID=your_google_web_client_id.apps.googleusercontent.com\nAPPLE_APP_BUNDLE_ID=com.yourcompany.smartlifeplanner",
              '{"status": "ok"}':
                  '{"status": "ok", "service": "smart-life-planner-api"}',
              "## 🔑 Google Sign-In Notes":
                  "## 🔑 Social Sign-In Notes",
              "Google Sign-In requires external Google Cloud / Firebase configuration:\n\n- Android package name must match the registered app\n- SHA-1 / SHA-256 fingerprints must be added\n- Flutter `default_web_client_id` must match backend `GOOGLE_CLIENT_ID`\n- backend must use the Web OAuth Client ID\n\nIf not configured, the app shows a setup-aware error instead of crashing.":
                  "Google and Apple sign-in require external provider configuration.\n\nFor Google:\n\n- Android package name must match the registered app\n- SHA-1 / SHA-256 fingerprints must be added\n- Flutter `default_web_client_id` must match backend `GOOGLE_CLIENT_ID`\n- the backend must use the Web OAuth Client ID\n\nFor Apple:\n\n- set `APPLE_APP_BUNDLE_ID` to the iOS bundle ID\n- enable the Sign in with Apple capability for the iOS app\n- display the Apple button only on supported platforms\n\nWhen provider settings are missing or invalid, the backend returns setup-aware errors instead of silently accepting unverified tokens.",
              "- Google Sign-In requires correct external OAuth setup":
                  "- Google Sign-In requires correct external OAuth setup\n- Apple Sign-In requires the correct bundle ID and Apple capability configuration",
              "[![LinkedIn](https://img.shields.io/badge/LinkedIn-Connect-0A66C2?style=for-the-badge&logo=linkedin&logoColor=white)](#)":
                  "[![LinkedIn](https://img.shields.io/badge/LinkedIn-Connect-0A66C2?style=for-the-badge&logo=linkedin&logoColor=white)](https://www.linkedin.com/in/mahmoudnagiubb/)",
              "[![Portfolio](https://img.shields.io/badge/Portfolio-Coming%20Soon-6C5CE7?style=for-the-badge)](#)\n":
                  "",
              "This project was developed as an academic software engineering project. Add your preferred license depending on your repository plan.":
                  "No open-source license is currently declared for this repository. Until a license file is added, the source is publicly viewable, but reuse, modification, and redistribution permissions are not granted."
          }

          missing = [old for old in replacements if old not in text]
          if missing:
              raise SystemExit(
                  "README changed unexpectedly; missing replacement targets:\n- "
                  + "\n- ".join(missing)
              )

          for old, new in replacements.items():
              text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Remove temporary workflow and commit README
        shell: bash
        run: |
          rm .github/workflows/readme-refinement.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/readme-refinement.yml
          git commit -m "docs: refine README accuracy and recruiter presentation"
          git push origin main
